# gradle.properties for Multiplayer Hardcore mod compiled for Minecraft 1.21.8

# Increase memory available to Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# -------------------------------------------------------------------------------
# Fabric Properties
#
# These versions control the Minecraft target, Yarn mappings, and Fabric loader.
# You can verify the latest versions on https://fabricmc.net/develop.
# For Minecraft 1.21.8 there is currently only build 1 of the Yarn mappings, so
# we set `yarn_mappings` to `1.21.8+build.1`. Leaving it at build 9 will cause
# dependency resolution errors because that mapping does not exist.

minecraft_version=1.21.8
yarn_mappings=1.21.8+build.1
loader_version=0.17.2

# -------------------------------------------------------------------------------
# Mod Properties
#
# These properties identify your mod on Modrinth/CurseForge and control its
# semantic versioning. Adjust `mod_version` whenever you release a new build.

mod_version=1.2.2
maven_group=me.zziger.mphardcore
archives_base_name=mphardcore

# -------------------------------------------------------------------------------
# Dependencies
#
# Specify versions for your dependencies here. Ensure they support the target
# Minecraft version. At the time of writing, the Fabric API has a 0.134.0 build
# that explicitly targets 1.21.8. MidnightLib 1.5.7 is still compatible with
# 1.21.x, and Server Translations API 2.3.1+1.21-pre2 remains the suggested
# version for mods updated from 1.21.6. If you encounter issues you may need
# to bump these versions (for example, to midnightlib 1.7.5 or newer), but
# those versions were not tested for this build.

fabric_version=0.134.0+1.21.8
midnightlib_version=1.5.7
server_translations_version=2.3.1+1.21-pre2